// How Gradle builds this module: an Android library, with Expo's plugin adding the Expo Modules API.
plugins {
  id 'com.android.library'
  id 'expo-module-gradle-plugin'
}

group = 'no.datslok.push'
version = '0.1.0'

android {
  namespace "no.datslok.push"
  defaultConfig {
    versionCode 1
    versionName "0.1.0"
  }
}

dependencies {
  // Firebase Cloud Messaging: the phone's token, and the pushes it brings (PushService.kt). The app's
  // google-services.json (app.json's googleServicesFile) says which Firebase project it belongs to.
  implementation 'com.google.firebase:firebase-messaging:25.1.3'
  // React Native, for androidx's NotificationCompat (which it brings along). No version: React
  // Native's Gradle plugin puts in the app's own.
  implementation 'com.facebook.react:react-android'
}
