[package]
name = "chatapp"
version = "0.1.0"
edition = "2021"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-notification = "2"
tauri-plugin-updater = "2"
tauri-plugin-window-state = "2"  # remembers the window's size and position
tauri-plugin-opener = "2"  # opens links in the default browser
serde_json = "1"  # needed by generate_context!() for the "plugins" settings
tauri-plugin-autostart = "2"
# Microsoft's own package for calling Windows (activity.rs: the open windows, their programs, a
# program's description). The same version Tauri itself uses, so it's built only once.
windows = { version = "0.62", features = [
    "Win32_Foundation",
    "Win32_Storage_FileSystem",
    "Win32_System_Threading",
    "Win32_UI_WindowsAndMessaging",
] }
