# Settings for the LiveKit server (voice), started by voice.ps1. No secrets here: the API key and
# secret come from .env, through the LIVEKIT_KEYS environment variable.

# Signalling: the WebSocket browsers use to join a room and hear who's in it. The Cloudflare
# Tunnel forwards wss://voice.datslok.no here, like it forwards the chat to port 8000.
port: 7880

rtc:
  # The voice itself. The tunnel can't carry it (it's UDP), so these two ports are forwarded
  # on the router straight to this PC.
  udp_port: 7882   # the normal way: everyone's audio over this one UDP port
  tcp_port: 7881   # the fallback, for networks that block UDP
  # Look up this PC's public IP address at startup (like whatismyip) and tell browsers to send
  # their audio there. After the internet provider changes the IP, restart LiveKit.
  use_external_ip: true

room:
  # The codecs calls may use: LiveKit's defaults, except H.264. By default LiveKit only accepts
  # H.264 profile 42e01f ("Constrained Baseline"), for which Chromium on Windows encodes on the
  # CPU (OpenH264). For 42001f ("Baseline") it can use the graphics card instead (Windows' Media
  # Foundation). Every browser decodes both. The line must match LiveKit's own exactly.
  # Plain video/h264 must stay too: LiveKit first checks "is H.264 allowed?" by name alone, and
  # with only the 42001f line that check fails and it falls back to VP8. With both, the server
  # accepts either profile, and Chromium offers 42001f first.
  enabled_codecs:
    - mime: audio/opus
    - mime: audio/red
    - mime: audio/pcmu
    - mime: audio/pcma
    - mime: video/vp8
    - mime: video/h264
    - mime: video/h264
      fmtp_line: "level-asymmetry-allowed=1;packetization-mode=1;profile-level-id=42001f"
    - mime: video/vp9
    - mime: video/av1
    - mime: video/h265
    - mime: video/rtx

logging:
  level: info
