<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <!-- The tab icon. "?v=2": a new address for each new icon, so nobody keeps an old one (browsers and Cloudflare may keep /favicon.ico for a day). -->
  <link rel="icon" href="/favicon.ico?v=2">
  <!-- The phone app (a PWA): its name, icons and look, so phones offer "Install app" (server.py, /manifest.json). -->
  <link rel="manifest" href="/manifest.json">
  <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png">
  <meta name="theme-color" content="#1e1f22">
  <title>Log in · ChatApp</title>
  <style>
    body {
      margin: 0;
      height: 100vh;   /* fallback for older browsers... */
      height: 100dvh;  /* ...the part of the screen that's really visible */
      display: flex;
      align-items: center;      /* centre the box vertically */
      justify-content: center;  /* ...and horizontally */
      font-family: system-ui, sans-serif;
      background: #313338;
      color: #dbdee1;
    }

    form {
      /* 384px wide, but never wider than the screen minus a 16px margin on each side */
      width: min(384px, 100% - 32px);
      box-sizing: border-box;  /* the padding counts inside that width */
      padding: 32px;
      border-radius: 8px;
      background: #2b2d31;
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    h1 {
      margin: 0 0 8px;
      font-size: 1.5rem;
      color: white;
      text-align: center;
    }

    label {
      display: flex;
      flex-direction: column;
      gap: 6px;
      font-size: 0.85rem;
      color: #b5bac1;
    }

    input {
      padding: 10px 12px;
      border: none;
      border-radius: 6px;
      background: #1e1f22;
      color: inherit;
      font-size: 1rem;
    }

    /* Our rules above (like label's display: flex) would otherwise beat the browser's own
       "hidden means display: none", and hidden fields would still show. */
    [hidden] {
      display: none !important;
    }

    #error {
      min-height: 1.2em;  /* keep the space even when empty, so the form doesn't jump */
      color: #f23f43;
      font-size: 0.9rem;
    }

    #submit {
      padding: 10px;
      border: none;
      border-radius: 6px;
      background: #5865f2;
      color: white;
      font-size: 1rem;
      cursor: pointer;
    }

    #forgot, #get-app, .switch {
      margin: 0;
      text-align: center;
      font-size: 0.9rem;
      color: #00a8fc;
    }

    .switch {
      color: #b5bac1;
    }

    /* A button that looks like a link: it switches the form, rather than going to another page. */
    .link-button {
      padding: 0;
      border: none;
      background: none;
      color: #00a8fc;
      font: inherit;
      text-decoration: underline;
      cursor: pointer;
    }
  </style>
</head>
<body>
  <form id="login-form">
    <h1 id="heading">ChatApp</h1>
    <label>
      Username
      <input id="username" autocomplete="username" required>
    </label>
    <label>
      Password
      <input id="password" type="password" autocomplete="current-password" required>
    </label>
    <!-- Only for new accounts: shown by "Create one". -->
    <label id="email-field" hidden>
      Email (for resetting your password)
      <input id="email" type="email" autocomplete="email">
    </label>
    <label id="invite-field" hidden>
      Invite code
      <input id="invite" autocomplete="off">
    </label>
    <div id="error"></div>
    <button id="submit">Log in</button>
    <a id="forgot" href="/reset">Forgot password?</a>
    <p id="to-register" class="switch">
      No account yet? <button type="button" class="link-button">Create one</button>
    </p>
    <p id="to-login" class="switch" hidden>
      Already have an account? <button type="button" class="link-button">Log in</button>
    </p>
    <a id="get-app" href="/download">Get the Windows app</a>
  </form>

  <script>
    const form = document.getElementById("login-form");
    const usernameInput = document.getElementById("username");
    const passwordInput = document.getElementById("password");
    const emailInput = document.getElementById("email");
    const inviteInput = document.getElementById("invite");
    const errorBox = document.getElementById("error");

    const heading = document.getElementById("heading");
    const submitButton = document.getElementById("submit");
    const emailField = document.getElementById("email-field");
    const inviteField = document.getElementById("invite-field");
    const forgotLink = document.getElementById("forgot");
    const toRegister = document.getElementById("to-register");
    const toLogin = document.getElementById("to-login");

    // Already in the desktop app? (Tauri puts __TAURI_INTERNALS__ on its pages; browsers don't have it.)
    if ("__TAURI_INTERNALS__" in window) document.getElementById("get-app").hidden = true;

    // The form has two modes: "login" (username and password) and "register" (plus email and invite code).
    let mode = "login";

    function showMode(newMode) {
      mode = newMode;
      const registering = mode === "register";
      heading.textContent = registering ? "Create account" : "ChatApp";
      submitButton.textContent = registering ? "Create account" : "Log in";
      emailField.hidden = !registering;
      inviteField.hidden = !registering;
      forgotLink.hidden = registering;
      toRegister.hidden = registering;
      toLogin.hidden = !registering;
      // A hidden field mustn't be required, or the browser would refuse to log in.
      emailInput.required = registering;
      // Tells password managers whether to fill in a saved password or suggest a new one.
      passwordInput.autocomplete = registering ? "new-password" : "current-password";
      errorBox.textContent = "";
      usernameInput.focus();  // put the cursor back in the first field
    }

    toRegister.querySelector("button").addEventListener("click", () => showMode("register"));
    toLogin.querySelector("button").addEventListener("click", () => showMode("login"));

    // Opened as /login?register (from the landing page's "Create an account"): start there.
    // URLSearchParams reads the part of the address after the "?".
    if (new URLSearchParams(location.search).has("register")) showMode("register");

    form.addEventListener("submit", async (event) => {
      event.preventDefault();  // stop the browser from reloading the page
      errorBox.textContent = "";

      const url = mode === "register" ? "/register" : "/login";

      const response = await fetch(url, {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({
          username: usernameInput.value,
          password: passwordInput.value,
          email: emailInput.value,    // these two are ignored when logging in
          invite: inviteInput.value,
        }),
      });

      if (response.ok) {
        // The server has set our session cookie: on to the chat. replace() instead of href:
        // the chat takes the login page's place in the history, so "back" doesn't lead here.
        location.replace("/");
        return;
      }

      // Show the server's error message, e.g. "Wrong username or password."
      const data = await response.json();
      errorBox.textContent = typeof data.detail === "string" ? data.detail : "Something went wrong.";
    });
  </script>
</body>
</html>
