<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <!-- The tab icon. "?v=2": a new address for each new icon, so nobody keeps an old one (browsers and Cloudflare may keep /favicon.ico for a day). -->
  <link rel="icon" href="/favicon.ico?v=2">
  <!-- The phone app (a PWA): its name, icons and look, so phones offer "Install app" (server.py, /manifest.json). -->
  <link rel="manifest" href="/manifest.json">
  <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png">
  <meta name="theme-color" content="#1e1f22">
  <title>Log in · ChatApp</title>
  <style>
    body {
      margin: 0;
      height: 100vh;   /* fallback for older browsers... */
      height: 100dvh;  /* ...the part of the screen that's really visible */
      display: flex;
      align-items: center;      /* centre the box vertically */
      justify-content: center;  /* ...and horizontally */
      font-family: system-ui, sans-serif;
      background: #313338;
      color: #dbdee1;
    }

    form {
      /* 384px wide, but never wider than the screen minus a 16px margin on each side */
      width: min(384px, 100% - 32px);
      box-sizing: border-box;  /* the padding counts inside that width */
      padding: 32px;
      border-radius: 8px;
      background: #2b2d31;
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    h1 {
      margin: 0 0 8px;
      font-size: 1.5rem;
      color: white;
      text-align: center;
    }

    label {
      display: flex;
      flex-direction: column;
      gap: 6px;
      font-size: 0.85rem;
      color: #b5bac1;
    }

    input {
      padding: 10px 12px;
      border: none;
      border-radius: 6px;
      background: #1e1f22;
      color: inherit;
      font-size: 1rem;
    }

    /* Our rules above (like label's display: flex) would otherwise beat the browser's own
       "hidden means display: none", and hidden fields would still show. */
    [hidden] {
      display: none !important;
    }

    /* Who invited you, or why you can't make an account (no link, or one that's used up). */
    #invite-note {
      margin: 0;
      padding: 10px 12px;
      border-radius: 6px;
      background: #1e1f22;
      font-size: 0.9rem;
      line-height: 1.4;
      text-align: center;
    }

    #error {
      min-height: 1.2em;  /* keep the space even when empty, so the form doesn't jump */
      color: #f23f43;
      font-size: 0.9rem;
    }

    #submit {
      padding: 10px;
      border: none;
      border-radius: 6px;
      background: #5865f2;
      color: white;
      font-size: 1rem;
      cursor: pointer;
    }

    #forgot, #get-app, .switch {
      margin: 0;
      text-align: center;
      font-size: 0.9rem;
      color: #00a8fc;
    }

    .switch {
      color: #b5bac1;
    }

    /* A button that looks like a link: it switches the form, rather than going to another page. */
    .link-button {
      padding: 0;
      border: none;
      background: none;
      color: #00a8fc;
      font: inherit;
      text-decoration: underline;
      cursor: pointer;
    }
  </style>
</head>
<body>
  <form id="login-form">
    <h1 id="heading">ChatApp</h1>
    <!-- Creating an account: who invited you, or that you need an invite link (see showMode). -->
    <p id="invite-note" hidden></p>
    <label id="username-field">
      Username
      <input id="username" autocomplete="username" required>
    </label>
    <label id="password-field">
      Password
      <input id="password" type="password" autocomplete="current-password" required>
    </label>
    <!-- Only for new accounts: shown by "Create one". -->
    <label id="email-field" hidden>
      Email (for resetting your password)
      <input id="email" type="email" autocomplete="email">
    </label>
    <div id="error"></div>
    <button id="submit">Log in</button>
    <a id="forgot" href="/reset">Forgot password?</a>
    <p id="to-register" class="switch">
      No account yet? <button type="button" class="link-button">Create one</button>
    </p>
    <p id="to-login" class="switch" hidden>
      Already have an account? <button type="button" class="link-button">Log in</button>
    </p>
    <a id="get-app" class="windows-app-link" href="/download" data-android="Get the Android app">Get the Windows app</a>
  </form>

  <script>
    // Phones can't run the Windows app. Android phones get the Android app instead (a link with
    // data-android says so; /download shows Android's on Android); iPhones, which have none, get nothing.
    if (/Android/.test(navigator.userAgent)) {
      for (const element of document.querySelectorAll(".windows-app-link[data-android]")) {
        element.textContent = element.dataset.android;
      }
    } else if (/iPhone|iPad/.test(navigator.userAgent)) {
      for (const element of document.querySelectorAll(".windows-app-link")) element.remove();
    }

    const form = document.getElementById("login-form");
    const usernameInput = document.getElementById("username");
    const passwordInput = document.getElementById("password");
    const emailInput = document.getElementById("email");
    const errorBox = document.getElementById("error");
    const inviteNote = document.getElementById("invite-note");
    const usernameField = document.getElementById("username-field");
    const passwordField = document.getElementById("password-field");

    const heading = document.getElementById("heading");
    const submitButton = document.getElementById("submit");
    const emailField = document.getElementById("email-field");
    const forgotLink = document.getElementById("forgot");
    const toRegister = document.getElementById("to-register");
    const toLogin = document.getElementById("to-login");

    // Already in the desktop app? (Tauri puts __TAURI_INTERNALS__ on its pages; browsers don't have it.)
    if ("__TAURI_INTERNALS__" in window) document.getElementById("get-app").hidden = true;

    // An invite link (/invite/<code>) brings people here as /login?register&invite=<code>.
    // URLSearchParams reads the part of the address after the "?".
    const params = new URLSearchParams(location.search);
    const inviteCode = params.get("invite") || "";
    // What the server says about it (/invite-info): {required, valid, inviter}. Until it has
    // answered, null: the form is shown as usual, and the server checks the invite anyway.
    let invite = null;

    // The form has two modes: "login" (username and password) and "register" (plus email).
    let mode = "login";

    function showMode(newMode) {
      mode = newMode;
      const registering = mode === "register";
      // Creating an account without a working invite link: no form, just how to get one.
      const blocked = registering && invite !== null && invite.required && !invite.valid;
      heading.textContent = registering ? "Create account" : "ChatApp";
      submitButton.textContent = registering ? "Create account" : "Log in";
      inviteNote.hidden = !registering || invite === null || (!blocked && !invite.inviter);
      if (blocked) {
        inviteNote.textContent = inviteCode
          ? "This invite link doesn't work any more: it has been used, or it's more than a week old. Ask for a new one."
          : "To make an account, you need an invite link from someone in the chat. Ask a friend for one!";
      } else if (registering && invite?.inviter) {
        inviteNote.textContent = `${invite.inviter} invited you to ChatApp 🎉`;  // (textContent: a name is never code)
      }
      usernameField.hidden = passwordField.hidden = submitButton.hidden = blocked;
      emailField.hidden = !registering || blocked;
      forgotLink.hidden = registering;
      toRegister.hidden = registering;
      toLogin.hidden = !registering;
      // A hidden field mustn't be required, or the browser would refuse to log in.
      emailInput.required = registering && !blocked;
      // Tells password managers whether to fill in a saved password or suggest a new one.
      passwordInput.autocomplete = registering ? "new-password" : "current-password";
      errorBox.textContent = "";
      usernameInput.focus();  // put the cursor back in the first field
    }

    toRegister.querySelector("button").addEventListener("click", () => showMode("register"));
    toLogin.querySelector("button").addEventListener("click", () => showMode("login"));

    // Opened as /login?register (from an invite link, or the landing page's "Create an account"):
    // start there.
    if (params.has("register")) showMode("register");

    // Ask the server whether an invite is needed, and about ours; then show the mode again with that.
    (async () => {
      try {
        const response = await fetch("/invite-info?code=" + encodeURIComponent(inviteCode));
        if (response.ok) invite = await response.json();
      } catch {
        return;  // (no answer: the form stays as it is, and the server checks when it's sent)
      }
      if (mode === "register") showMode("register");
    })();

    form.addEventListener("submit", async (event) => {
      event.preventDefault();  // stop the browser from reloading the page
      errorBox.textContent = "";

      const url = mode === "register" ? "/register" : "/login";

      const response = await fetch(url, {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({
          username: usernameInput.value,
          password: passwordInput.value,
          email: emailInput.value,  // these two are ignored when logging in
          invite: inviteCode,
        }),
      });

      if (response.ok) {
        // The server has set our session cookie: on to the chat (or, for a new account, to "check
        // your inbox" first: the server sends it there). replace() instead of href: the next page
        // takes the login page's place in the history, so "back" doesn't lead here.
        location.replace("/");
        return;
      }

      // Show the server's error message, e.g. "Wrong username or password."
      const data = await response.json();
      errorBox.textContent = typeof data.detail === "string" ? data.detail : "Something went wrong.";
    });
  </script>
</body>
</html>
