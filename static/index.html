<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Our Chat</title>
  <style>
    body {
      margin: 0;
      height: 100vh;
      display: flex;  /* sidebar, chat and online list side by side */
      font-family: system-ui, sans-serif;
      background: #313338;
      color: #dbdee1;
    }

    #sidebar {
      width: 200px;
      padding: 16px 8px;
      background: #2b2d31;
      display: flex;
      flex-direction: column;
      gap: 2px;
    }

    .channel {
      padding: 8px 12px;
      border: none;
      border-radius: 6px;
      background: none;
      color: #949ba4;
      font-size: 1rem;
      text-align: left;
      cursor: pointer;
    }

    .channel:hover {
      background: #35373c;
      color: #dbdee1;
    }

    .channel.active {
      background: #404249;
      color: white;
    }

    #channel-list {
      flex: 1;  /* take up the free space, which pushes the logout button to the bottom */
      display: flex;
      flex-direction: column;
      gap: 2px;
    }

    #chat {
      flex: 1;
      min-width: 0;  /* lets long messages wrap instead of stretching the page */
      display: flex;
      flex-direction: column;  /* messages, typing line and text box stacked */
    }

    #messages {
      flex: 1;
      overflow-y: auto;
      padding: 16px;
    }

    .message {
      padding: 4px 0;
    }

    .name {
      color: white;
    }

    #typing {
      height: 1.2em;  /* keep the space even when empty, so the page doesn't jump */
      padding: 0 16px;
      font-size: 0.85rem;
      color: #949ba4;
    }

    #chat-form {
      display: flex;
      gap: 8px;
      padding: 8px 16px 16px;
    }

    #message-input {
      flex: 1;
      padding: 10px 12px;
      border: none;
      border-radius: 8px;
      background: #383a40;
      color: inherit;
      font-size: 1rem;
    }

    #chat-form button {
      padding: 10px 16px;
      border: none;
      border-radius: 8px;
      background: #5865f2;
      color: white;
      font-size: 1rem;
      cursor: pointer;
    }

    #members {
      width: 200px;
      padding: 16px;
      background: #2b2d31;
    }

    #members h2 {
      margin: 0 0 8px;
      font-size: 0.75rem;
      text-transform: uppercase;
      color: #949ba4;
    }

    #online-list {
      margin: 0;
      padding: 0;
      list-style: none;  /* no bullet points */
    }

    #online-list li {
      padding: 4px 0;
    }

    /* A green dot in front of each name, drawn with CSS (no image needed). */
    #online-list li::before {
      content: "";
      display: inline-block;
      width: 8px;
      height: 8px;
      margin-right: 8px;
      border-radius: 50%;  /* a square with fully rounded corners is a circle */
      background: #23a55a;
    }
  </style>
</head>
<body>
  <nav id="sidebar">
    <div id="channel-list"></div>
    <button id="logout" class="channel">Log out</button>
  </nav>

  <main id="chat">
    <div id="messages"></div>
    <div id="typing"></div>

    <form id="chat-form">
      <input id="message-input" autocomplete="off">
      <button>Send</button>
    </form>
  </main>

  <aside id="members">
    <h2 id="online-heading">Online</h2>
    <ul id="online-list"></ul>
  </aside>

  <script>
    // Grab the HTML elements we need, by their id.
    const channelList = document.getElementById("channel-list");
    const logoutButton = document.getElementById("logout");
    const messages = document.getElementById("messages");
    const typingLine = document.getElementById("typing");
    const form = document.getElementById("chat-form");
    const input = document.getElementById("message-input");
    const onlineHeading = document.getElementById("online-heading");
    const onlineList = document.getElementById("online-list");

    let socket = null;          // our one WebSocket, open as long as the tab is
    let currentChannel = null;  // the channel we're looking at

    // Ask the server which channels exist, make a sidebar button for each,
    // then connect and open the first channel.
    async function start() {
      const response = await fetch("/channels");
      const channels = await response.json();  // e.g. ["general", "memes"]

      for (const channel of channels) {
        const button = document.createElement("button");
        button.className = "channel";
        button.textContent = "# " + channel;
        button.dataset.channel = channel;  // remember which channel this button is for
        button.addEventListener("click", () => switchChannel(channel));
        channelList.appendChild(button);
      }

      socket = new WebSocket(`ws://${location.host}/ws`);
      // We can only send once the connection is open, so join the first channel then.
      socket.addEventListener("open", () => switchChannel(channels[0]));
      socket.addEventListener("message", handleServerMessage);
    }

    // Everything the server sends comes through here. Its "type" says what it is.
    function handleServerMessage(event) {
      const data = JSON.parse(event.data);  // JSON string -> object

      if (data.type === "online") {
        showOnline(data.users);
        return;
      }

      // Everything else belongs to a channel. Ignore it if it's for a channel we
      // just left (it was already on its way when we switched).
      if (data.channel !== currentChannel) return;

      if (data.type === "history") {
        for (const message of data.messages) {
          showMessage(message);
        }
      } else if (data.type === "message") {
        stopTyping(data.name);  // their message arrived, so they're done typing
        showMessage(data);
      } else if (data.type === "typing") {
        showTyping(data.name);
      }
    }

    // Switch channel: clear the screen and tell the server. It answers with the history.
    function switchChannel(channel) {
      if (channel === currentChannel) return;
      currentChannel = channel;

      messages.replaceChildren();  // remove all the old channel's messages
      clearTyping();
      input.placeholder = "Message #" + channel;

      // Highlight the button for the channel we're in.
      for (const button of channelList.children) {
        button.classList.toggle("active", button.dataset.channel === channel);
      }

      socket.send(JSON.stringify({ type: "join", channel: channel }));
    }

    // The user pressed Enter or clicked Send.
    form.addEventListener("submit", (event) => {
      event.preventDefault();  // stop the browser from reloading the page
      const text = input.value.trim();
      if (text === "") return;
      // Only the text: the server knows who we are and which channel we're in.
      socket.send(JSON.stringify({ type: "message", text: text }));
      input.value = "";
      lastTypingSent = 0;  // so typing the next message is announced straight away
    });

    // Log out: the server forgets our session, then we go back to the login page.
    logoutButton.addEventListener("click", async () => {
      await fetch("/logout", { method: "POST" });
      location.href = "/login";
    });

    // ---------- Online list ----------

    function showOnline(users) {
      onlineHeading.textContent = `Online — ${users.length}`;
      onlineList.replaceChildren();
      for (const user of users) {
        const item = document.createElement("li");
        item.textContent = user;
        onlineList.appendChild(item);
      }
    }

    // ---------- "is typing…" ----------

    // Sending: the "input" event fires on every keystroke, but we tell the server
    // at most once every 2 seconds (throttling), so we don't flood it.
    let lastTypingSent = 0;  // when we last sent "typing", in milliseconds
    input.addEventListener("input", () => {
      const now = Date.now();  // milliseconds since 1970: a simple clock
      if (input.value.trim() !== "" && now - lastTypingSent > 2000) {
        socket.send(JSON.stringify({ type: "typing" }));
        lastTypingSent = now;
      }
    });

    // Showing: who's typing, each with a timer that removes them after 3 quiet seconds.
    const typers = new Map();  // name -> timer id

    function showTyping(name) {
      clearTimeout(typers.get(name));  // cancel their old timer, if any...
      const timer = setTimeout(() => stopTyping(name), 3000);  // ...and start a fresh one
      typers.set(name, timer);
      updateTypingLine();
    }

    function stopTyping(name) {
      clearTimeout(typers.get(name));
      typers.delete(name);
      updateTypingLine();
    }

    function clearTyping() {
      for (const timer of typers.values()) {
        clearTimeout(timer);
      }
      typers.clear();
      updateTypingLine();
    }

    function updateTypingLine() {
      const names = [...typers.keys()];  // the Map's keys as a normal array
      if (names.length === 0) {
        typingLine.textContent = "";
      } else if (names.length === 1) {
        typingLine.textContent = `${names[0]} is typing…`;
      } else if (names.length === 2) {
        typingLine.textContent = `${names[0]} and ${names[1]} are typing…`;
      } else {
        typingLine.textContent = "Several people are typing…";
      }
    }

    // ---------- Messages ----------

    // Add one message to the bottom of the #messages box.
    // Built piece by piece with textContent, never innerHTML: names and text are
    // shown as-is, so neither can ever run as code.
    function showMessage(message) {
      const div = document.createElement("div");
      div.className = "message";

      const nameElement = document.createElement("strong");
      nameElement.className = "name";
      nameElement.textContent = message.name;

      div.appendChild(nameElement);
      div.appendChild(document.createTextNode(": " + message.text));

      // Were we scrolled to (or near) the bottom before this message arrived?
      const distanceFromBottom = messages.scrollHeight - messages.scrollTop - messages.clientHeight;
      const wasAtBottom = distanceFromBottom < 50;

      messages.appendChild(div);

      // Only follow new messages if we were already at the bottom,
      // so we don't yank someone away from older messages they're reading.
      if (wasAtBottom) {
        messages.scrollTop = messages.scrollHeight;
      }
    }

    start();
  </script>
</body>
</html>
