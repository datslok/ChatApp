<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Our Chat</title>
  <style>
    body {
      margin: 0;
      height: 100vh;
      display: flex;  /* sidebar and chat side by side */
      font-family: system-ui, sans-serif;
      background: #313338;
      color: #dbdee1;
    }

    #sidebar {
      width: 200px;
      padding: 16px 8px;
      background: #2b2d31;
      display: flex;
      flex-direction: column;
      gap: 2px;
    }

    .channel {
      padding: 8px 12px;
      border: none;
      border-radius: 6px;
      background: none;
      color: #949ba4;
      font-size: 1rem;
      text-align: left;
      cursor: pointer;
    }

    .channel:hover {
      background: #35373c;
      color: #dbdee1;
    }

    .channel.active {
      background: #404249;
      color: white;
    }

    #chat {
      flex: 1;
      min-width: 0;  /* lets long messages wrap instead of stretching the page */
      display: flex;
      flex-direction: column;  /* messages above, text box below */
    }

    #messages {
      flex: 1;
      overflow-y: auto;
      padding: 16px;
    }

    .message {
      padding: 4px 0;
    }

    .name {
      color: white;
    }

    #chat-form {
      display: flex;
      gap: 8px;
      padding: 16px;
    }

    #message-input {
      flex: 1;
      padding: 10px 12px;
      border: none;
      border-radius: 8px;
      background: #383a40;
      color: inherit;
      font-size: 1rem;
    }

    #chat-form button {
      padding: 10px 16px;
      border: none;
      border-radius: 8px;
      background: #5865f2;
      color: white;
      font-size: 1rem;
      cursor: pointer;
    }
  </style>
</head>
<body>
  <nav id="sidebar"></nav>

  <main id="chat">
    <div id="messages"></div>

    <form id="chat-form">
      <input id="message-input" autocomplete="off">
      <button>Send</button>
    </form>
  </main>

  <script>
    // Grab the HTML elements we need, by their id.
    const sidebar = document.getElementById("sidebar");
    const messages = document.getElementById("messages");
    const form = document.getElementById("chat-form");
    const input = document.getElementById("message-input");

    // Get our name from this browser's storage, or ask for it the first time.
    let name = localStorage.getItem("name");
    while (!name) {
      name = (prompt("What's your name?") || "").trim().slice(0, 32);
    }
    localStorage.setItem("name", name);

    let socket = null;          // the WebSocket for the channel we're in
    let currentChannel = null;

    // Ask the server which channels exist, make a sidebar button for each, and open the first.
    async function start() {
      const response = await fetch("/channels");
      const channels = await response.json();  // e.g. ["general", "memes"]

      for (const channel of channels) {
        const button = document.createElement("button");
        button.className = "channel";
        button.textContent = "# " + channel;
        button.dataset.channel = channel;  // remember which channel this button is for
        button.addEventListener("click", () => switchChannel(channel));
        sidebar.appendChild(button);
      }

      switchChannel(channels[0]);
    }

    // Leave the current channel and join another: close the old WebSocket, clear the
    // messages, and open a new WebSocket (the server then sends that channel's history).
    function switchChannel(channel) {
      if (channel === currentChannel) return;
      currentChannel = channel;

      if (socket) socket.close();
      messages.replaceChildren();  // remove all the old channel's messages
      input.placeholder = "Message #" + channel;

      // Highlight the button for the channel we're in.
      for (const button of sidebar.children) {
        button.classList.toggle("active", button.dataset.channel === channel);
      }

      socket = new WebSocket(`ws://${location.host}/ws/${channel}`);
      socket.addEventListener("message", (event) => {
        const message = JSON.parse(event.data);  // JSON string -> object with .name and .text
        showMessage(message);
      });
    }

    // The user pressed Enter or clicked Send.
    form.addEventListener("submit", (event) => {
      event.preventDefault();  // stop the browser from reloading the page
      const text = input.value.trim();
      if (text === "") return;
      socket.send(JSON.stringify({ name: name, text: text }));  // object -> JSON string
      input.value = "";
    });

    // Add one message to the bottom of the #messages box.
    // Built piece by piece with textContent, never innerHTML: names and text are
    // shown as-is, so neither can ever run as code.
    function showMessage(message) {
      const div = document.createElement("div");
      div.className = "message";

      const nameElement = document.createElement("strong");
      nameElement.className = "name";
      nameElement.textContent = message.name;

      div.appendChild(nameElement);
      div.appendChild(document.createTextNode(": " + message.text));

      // Were we scrolled to (or near) the bottom before this message arrived?
      const distanceFromBottom = messages.scrollHeight - messages.scrollTop - messages.clientHeight;
      const wasAtBottom = distanceFromBottom < 50;

      messages.appendChild(div);

      // Only follow new messages if we were already at the bottom,
      // so we don't yank someone away from older messages they're reading.
      if (wasAtBottom) {
        messages.scrollTop = messages.scrollHeight;
      }
    }

    start();
  </script>
</body>
</html>
