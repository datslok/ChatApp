<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Our Chat</title>
  <style>
    body {
      margin: 0;
      height: 100vh;   /* fallback for older browsers... */
      height: 100dvh;  /* ...the part of the screen that's really visible (phones: minus the address bar) */
      display: flex;  /* sidebar, chat and online list side by side */
      font-family: system-ui, sans-serif;
      background: #313338;
      color: #dbdee1;
    }

    #sidebar {
      width: 200px;
      padding: 16px 8px;
      background: #2b2d31;
      display: flex;
      flex-direction: column;
    }

    #sidebar-lists {
      flex: 1;  /* take up the free space, which pushes the logout button to the bottom */
      overflow-y: auto;  /* scroll if there are many channels and people */
    }

    #channel-list,
    #dm-list {
      display: flex;
      flex-direction: column;
      gap: 2px;
    }

    .section-heading {
      margin: 16px 0 8px;
      padding: 0 12px;
      font-size: 0.75rem;
      text-transform: uppercase;
      color: #949ba4;
    }

    .channel {
      padding: 8px 12px;
      border: none;
      border-radius: 6px;
      background: none;
      color: #949ba4;
      font-size: 1rem;
      text-align: left;
      cursor: pointer;
    }

    .channel:hover {
      background: #35373c;
      color: #dbdee1;
    }

    .channel.active {
      background: #404249;
      color: white;
    }

    .channel {
      position: relative;  /* so the unread dot can be placed against its left edge */
    }

    .channel.unread {
      color: white;
      font-weight: 600;  /* bold */
    }

    /* The unread dot: a small white circle just left of the name. */
    .channel.unread::before {
      content: "";
      position: absolute;
      left: 1px;  /* inside the button's left padding (the sidebar list would cut off anything further out) */
      top: 50%;
      width: 8px;
      height: 8px;
      margin-top: -4px;  /* half its height, so it sits exactly in the middle */
      border-radius: 50%;
      background: white;
    }

    /* A small round status dot: grey for offline, green for online. */
    .dot {
      display: inline-block;
      width: 8px;
      height: 8px;
      margin-right: 8px;
      border-radius: 50%;  /* a square with fully rounded corners is a circle */
      background: #80848e;
    }

    .dot.online {
      background: #23a55a;
    }

    #chat {
      flex: 1;
      min-width: 0;  /* lets long messages wrap instead of stretching the page */
      display: flex;
      flex-direction: column;  /* messages, status line and text box stacked */
      position: relative;  /* so the drop overlay can be placed on top of it */
    }

    /* Covers the whole chat while you drag files over it. */
    #drop-overlay {
      position: absolute;
      inset: 8px;  /* 8px in from every edge of #chat */
      display: flex;
      align-items: center;
      justify-content: center;
      border: 3px dashed #5865f2;
      border-radius: 12px;
      background: rgba(30, 31, 34, 0.9);  /* nearly opaque dark grey */
      color: white;
      font-size: 1.3rem;
    }

    /* display: flex above would beat the "hidden" attribute, so say it explicitly. */
    #drop-overlay[hidden] {
      display: none;
    }

    #banner {
      padding: 8px 16px;
      background: #f0b232;
      color: #1e1f22;
      font-size: 0.9rem;
    }

    #messages {
      flex: 1;
      overflow-y: auto;
      padding: 16px;
    }

    /* A message: picture on the left; name, text and attachment stacked on the right. */
    .message {
      display: flex;
      gap: 12px;
      padding: 6px 0;
    }

    .message-body {
      min-width: 0;  /* lets long words wrap instead of stretching the message */
      overflow-wrap: anywhere;
    }

    .name {
      color: white;
      font-weight: 600;
    }

    /* Names and pictures you can click to see someone's profile. */
    .clickable {
      cursor: pointer;
    }

    .name.clickable:hover {
      text-decoration: underline;
    }

    /* Profile pictures: round, and cropped to fill the circle. Three sizes. */
    .avatar {
      width: 40px;
      height: 40px;
      flex-shrink: 0;  /* never squashed by the text next to it */
      border-radius: 50%;
      object-fit: cover;
    }

    .avatar.small {
      width: 24px;
      height: 24px;
      font-size: 0.75rem;
    }

    .avatar.large {
      width: 96px;
      height: 96px;
      font-size: 2.5rem;
    }

    /* No picture: a coloured circle with the first letter of the name. */
    .avatar.letter {
      display: flex;
      align-items: center;
      justify-content: center;
      color: white;
      font-weight: 600;
    }

    /* A person in the DM list or online list: picture (with online dot), name, status. */
    .person {
      display: flex;
      align-items: center;
      gap: 10px;
      min-width: 0;
    }

    .person-picture {
      position: relative;  /* so the online dot can sit on its corner */
      display: flex;
    }

    .person-picture .dot {
      position: absolute;
      right: -2px;
      bottom: -2px;
      width: 10px;
      height: 10px;
      margin: 0;
      border: 2px solid #2b2d31;  /* a ring in the sidebar's colour, to separate it from the picture */
    }

    .person-text {
      display: flex;
      flex-direction: column;
      min-width: 0;
    }

    .person-status {
      overflow: hidden;         /* a long status gets cut off... */
      text-overflow: ellipsis;  /* ...with "…" */
      white-space: nowrap;
      font-size: 0.75rem;
      font-weight: normal;
      color: #949ba4;
    }

    .attachment-image {
      display: block;
      max-width: min(400px, 100%);
      max-height: 300px;
      margin-top: 4px;
      border-radius: 8px;
    }

    /* The image popup ("lightbox"). A <dialog> that covers the whole window. */
    #image-viewer {
      width: 100vw;
      height: 100vh;
      max-width: none;   /* undo the browser's default dialog size limits */
      max-height: none;
      margin: 0;
      padding: 0;
      border: none;
      background: transparent;
    }

    /* Only when it's open: a closed dialog must stay hidden, and display: flex would show it. */
    #image-viewer[open] {
      display: flex;
      align-items: center;
      justify-content: center;
    }

    /* The darkened page behind the popup. */
    #image-viewer::backdrop {
      background: rgba(0, 0, 0, 0.85);
    }

    #viewer-image {
      max-width: 90vw;
      max-height: 90vh;
      border-radius: 8px;
    }

    /* The Settings popup. */
    #settings {
      width: min(420px, 100% - 32px);
      box-sizing: border-box;
      max-height: 90vh;
      overflow-y: auto;  /* scroll if it doesn't fit (small phones) */
      padding: 24px;
      border: none;
      border-radius: 8px;
      background: #2b2d31;
      color: inherit;
    }

    #settings::backdrop {
      background: rgba(0, 0, 0, 0.6);
    }

    #settings h2 {
      margin: 0 0 16px;
      color: white;
    }

    #settings h3 {
      margin: 20px 0 8px;
      font-size: 0.75rem;
      text-transform: uppercase;
      color: #949ba4;
    }

    #settings form {
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    #settings label {
      display: flex;
      flex-direction: column;
      gap: 6px;
      font-size: 0.85rem;
      color: #b5bac1;
    }

    #settings input {
      padding: 10px 12px;
      border: none;
      border-radius: 6px;
      background: #1e1f22;
      color: inherit;
      font-size: 1rem;
    }

    #settings button {
      padding: 10px;
      border: none;
      border-radius: 6px;
      background: #5865f2;
      color: white;
      font-size: 1rem;
      cursor: pointer;
    }

    #settings #settings-close {
      position: absolute;
      top: 16px;
      right: 16px;
      width: 32px;
      height: 32px;
      padding: 0;
      border-radius: 50%;
      background: #1e1f22;
    }

    #settings .status {
      min-height: 1.2em;
      font-size: 0.9rem;
    }

    #settings .status.error {
      color: #f23f43;
    }

    #settings .status.success {
      color: #23a55a;
    }

    #viewer-close {
      position: fixed;
      top: 16px;
      right: 16px;
      width: 36px;
      height: 36px;
      border: none;
      border-radius: 50%;
      background: #2b2d31;
      color: white;
      font-size: 1.2rem;
      cursor: pointer;
    }

    .attachment-file {
      display: inline-block;
      margin-top: 4px;
      padding: 8px 12px;
      border-radius: 8px;
      background: #2b2d31;
      color: #00a8fc;
    }

    /* "kari is typing…" on the left, "Uploading cat.png…" on the right */
    #status-line {
      height: 1.2em;  /* keep the space even when empty, so the page doesn't jump */
      padding: 0 16px;
      display: flex;
      justify-content: space-between;
      font-size: 0.85rem;
      color: #949ba4;
    }

    #upload-status.error {
      color: #f23f43;
    }

    /* Files waiting to be sent, shown just above the text box. */
    #tray {
      display: flex;
      flex-wrap: wrap;  /* start a new row if there are many */
      gap: 8px;
      padding: 8px 16px 0;
    }

    #tray[hidden] {
      display: none;
    }

    .tray-item {
      position: relative;  /* so the × can be placed in its corner */
      width: 80px;
      height: 80px;
      border-radius: 8px;
      background: #2b2d31;
      overflow: hidden;  /* cut off anything that sticks out, like the image's corners */
    }

    .tray-item img {
      width: 100%;
      height: 100%;
      object-fit: cover;  /* fill the square, cropping the picture instead of squashing it */
    }

    .tray-item.file {
      width: 160px;
      padding: 8px 28px 8px 8px;  /* room on the right for the × */
      box-sizing: border-box;     /* count the padding inside the 160px, not on top of it */
      font-size: 0.8rem;
      overflow-wrap: anywhere;    /* break long file names instead of overflowing */
    }

    .tray-item.failed {
      outline: 2px solid #f23f43;
    }

    .tray-item .remove {
      position: absolute;
      top: 4px;
      right: 4px;
      width: 20px;
      height: 20px;
      padding: 0;
      border: none;
      border-radius: 50%;
      background: #f23f43;
      color: white;
      font-size: 0.8rem;
      line-height: 20px;
      cursor: pointer;
    }

    #chat-form {
      display: flex;
      gap: 8px;
      padding: 8px 16px 16px;
    }

    #message-input {
      flex: 1;
      padding: 10px 12px;
      border: none;
      border-radius: 8px;
      background: #383a40;
      color: inherit;
      font-size: 1rem;
    }

    #chat-form button {
      padding: 10px 16px;
      border: none;
      border-radius: 8px;
      background: #5865f2;
      color: white;
      font-size: 1rem;
      cursor: pointer;
    }

    #chat-form #attach-button {
      padding: 10px 14px;
      background: #383a40;
      color: #dbdee1;
      font-size: 1.2rem;
      line-height: 1;
    }

    #members {
      width: 200px;
      padding: 16px;
      background: #2b2d31;
    }

    #members .section-heading {
      margin-top: 0;
      padding: 0;
    }

    #online-list {
      margin: 0;
      padding: 0;
      list-style: none;  /* no bullet points */
    }

    #online-list li {
      padding: 4px 0;
    }

    /* Someone's profile, shown when you click their name or picture. */
    #profile {
      width: min(340px, 100% - 32px);
      box-sizing: border-box;
      padding: 24px;
      border: none;
      border-radius: 8px;
      background: #2b2d31;
      color: inherit;
      text-align: center;
    }

    #profile::backdrop {
      background: rgba(0, 0, 0, 0.6);
    }

    #profile .avatar {
      margin: 0 auto 12px;  /* centred */
    }

    #profile-name {
      margin: 0;
      font-size: 1.3rem;
      color: white;
    }

    #profile-status {
      margin: 4px 0 0;
      color: #949ba4;
    }

    #profile-bio {
      margin: 16px 0 0;
      white-space: pre-wrap;  /* keep the line breaks the person typed */
      text-align: left;
    }

    #profile-message {
      margin-top: 20px;
      width: 100%;
      padding: 10px;
      border: none;
      border-radius: 6px;
      background: #5865f2;
      color: white;
      font-size: 1rem;
      cursor: pointer;
    }

    #profile-close {
      position: absolute;
      top: 12px;
      right: 12px;
      width: 32px;
      height: 32px;
      border: none;
      border-radius: 50%;
      background: #1e1f22;
      color: white;
      cursor: pointer;
    }

    /* The picture editor. */
    #cropper {
      width: min(340px, 100% - 32px);
      box-sizing: border-box;
      padding: 24px;
      border: none;
      border-radius: 8px;
      background: #2b2d31;
      color: inherit;
      text-align: center;
    }

    #cropper::backdrop {
      background: rgba(0, 0, 0, 0.7);
    }

    #cropper h2 {
      margin: 0 0 4px;
      color: white;
    }

    .crop-hint {
      margin: 0 0 16px;
      font-size: 0.85rem;
      color: #949ba4;
    }

    #crop-canvas {
      display: block;
      width: min(256px, 100%);  /* the canvas has 256 pixels, but may be shown smaller on phones */
      aspect-ratio: 1;          /* always square: height follows width */
      margin: 0 auto;
      border-radius: 50%;       /* shown as a circle, like the finished picture */
      background: #1e1f22;
      cursor: grab;
      touch-action: none;       /* phones: dragging moves the picture instead of scrolling the page */
    }

    .crop-zoom {
      display: flex;
      align-items: center;
      gap: 12px;
      margin-top: 16px;
      font-size: 0.85rem;
      color: #b5bac1;
    }

    .crop-zoom input {
      flex: 1;
    }

    .crop-buttons {
      display: flex;
      gap: 8px;
      margin-top: 20px;
    }

    .crop-buttons button {
      flex: 1;
      padding: 10px;
      border: none;
      border-radius: 6px;
      background: #5865f2;
      color: white;
      font-size: 1rem;
      cursor: pointer;
    }

    .crop-buttons #crop-cancel {
      background: #4e5058;
    }

    /* Settings: your picture with its two buttons next to it. */
    #avatar-row {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    #settings #avatar-row button {
      padding: 8px 12px;
      font-size: 0.9rem;
    }

    #settings #remove-avatar {
      background: #4e5058;
    }

    #settings textarea {
      padding: 10px 12px;
      border: none;
      border-radius: 6px;
      background: #1e1f22;
      color: inherit;
      font: inherit;  /* textareas don't use the page's font by default */
      resize: vertical;
    }
    /* The top bar and the drawer backdrop only exist on phones (see below). */
    #topbar,
    #drawer-backdrop {
      display: none;
    }

    /* ---------- Phones and other narrow screens ----------
       Everything in here only applies when the screen is 700px wide or less. */
    @media (max-width: 700px) {
      /* A bar above the messages: ☰ (channels), where we are, 👥 (online). */
      #topbar {
        display: flex;
        align-items: center;
        gap: 4px;
        padding: 4px;
        border-bottom: 1px solid #26272b;
      }

      #topbar button {
        position: relative;  /* for the unread dot on ☰ */
        padding: 8px 12px;
        border: none;
        background: none;
        color: #dbdee1;
        font-size: 1.3rem;
        cursor: pointer;
      }

      #topbar-title {
        flex: 1;
        overflow: hidden;         /* a very long name gets cut off... */
        text-overflow: ellipsis;  /* ...with "…" */
        white-space: nowrap;
        font-weight: 600;
        color: white;
      }

      /* Something unread somewhere: a red dot on the ☰ button. */
      #open-sidebar.has-unread::after {
        content: "";
        position: absolute;
        top: 8px;
        right: 8px;
        width: 8px;
        height: 8px;
        border-radius: 50%;
        background: #f23f43;
      }

      /* Both side columns become drawers: taken out of the row, laid over the chat,
         and parked just off-screen until opened. */
      #sidebar,
      #members {
        position: fixed;
        top: 0;
        bottom: 0;
        z-index: 10;  /* on top of the chat */
        width: 80vw;
        max-width: 280px;
        box-sizing: border-box;
        transition: transform 0.2s ease;  /* animate the sliding */
      }

      #sidebar {
        left: 0;
        transform: translateX(-100%);  /* moved left by its own width: just off-screen */
      }

      #members {
        right: 0;
        transform: translateX(100%);  /* moved right by its own width */
      }

      #sidebar.open,
      #members.open {
        transform: translateX(0);  /* slide into view */
      }

      /* Darkens the chat behind an open drawer; tapping it closes the drawer. */
      #drawer-backdrop {
        display: block;
        position: fixed;
        inset: 0;
        z-index: 5;  /* above the chat, below the drawers */
        background: rgba(0, 0, 0, 0.5);
      }

      #drawer-backdrop[hidden] {
        display: none;
      }

      /* Bigger targets for fingers. */
      .channel {
        padding: 12px;
      }

      .tray-item .remove {
        width: 28px;
        height: 28px;
        line-height: 28px;
      }

      /* A bit less empty space, since the screen is small. */
      #messages {
        padding: 12px;
      }

      #chat-form {
        padding: 8px;
      }
    }
  </style>
</head>
<body>
  <nav id="sidebar">
    <div id="sidebar-lists">
      <div id="channel-list"></div>
      <h2 class="section-heading">Direct messages</h2>
      <div id="dm-list"></div>
    </div>
    <button id="settings-button" class="channel">Settings</button>
    <button id="logout" class="channel">Log out</button>
  </nav>

  <main id="chat">
    <!-- Only shown on phones (see the @media rules). -->
    <header id="topbar">
      <button type="button" id="open-sidebar" title="Channels">☰</button>
      <span id="topbar-title"></span>
      <button type="button" id="open-members" title="Online">👥</button>
    </header>
    <div id="banner" hidden>Connection lost, reconnecting…</div>
    <div id="messages"></div>
    <div id="status-line">
      <span id="typing"></span>
      <span id="upload-status"></span>
    </div>

    <div id="tray" hidden></div>

    <form id="chat-form">
      <!-- type="button": clicking it must not submit (send) the form -->
      <button type="button" id="attach-button" title="Upload a file">+</button>
      <!-- The browser's own file picker. Hidden; the + button opens it. -->
      <input type="file" id="file-input" multiple hidden>
      <input id="message-input" autocomplete="off">
      <button>Send</button>
    </form>

    <div id="drop-overlay" hidden>Drop to upload</div>
  </main>

  <aside id="members">
    <h2 id="online-heading" class="section-heading">Online</h2>
    <ul id="online-list"></ul>
  </aside>

  <!-- The Settings popup: your email and your password. -->
  <dialog id="settings">
    <button type="button" id="settings-close" title="Close">×</button>
    <h2>Settings</h2>

    <h3>Profile</h3>
    <form id="profile-form">
      <div id="avatar-row">
        <span id="settings-avatar"></span>
        <button type="button" id="change-avatar">Change picture</button>
        <button type="button" id="remove-avatar">Remove</button>
        <input type="file" id="avatar-input" accept="image/*" hidden>
      </div>
      <label>
        Status
        <input id="status-input" maxlength="60" placeholder="e.g. 🎮 playing Minecraft">
      </label>
      <label>
        Bio
        <textarea id="bio-input" maxlength="300" rows="3" placeholder="A few words about yourself"></textarea>
      </label>
      <div id="profile-status-line" class="status"></div>
      <button>Save profile</button>
    </form>

    <h3>Username</h3>
    <form id="username-form">
      <p>Current: <strong id="current-username">…</strong></p>
      <label>
        New username
        <input id="new-username" autocomplete="username" required>
      </label>
      <label>
        Your password (to confirm it's you)
        <input id="username-password" type="password" autocomplete="current-password" required>
      </label>
      <div id="username-status" class="status"></div>
      <button>Change username</button>
    </form>

    <h3>Email</h3>
    <form id="email-form">
      <p>Current: <strong id="current-email">…</strong></p>
      <label>
        New email
        <input id="new-email" type="email" autocomplete="email" required>
      </label>
      <label>
        Your password (to confirm it's you)
        <input id="email-password" type="password" autocomplete="current-password" required>
      </label>
      <div id="email-status" class="status"></div>
      <button>Save email</button>
    </form>

    <h3>Password</h3>
    <form id="password-form">
      <label>
        Current password
        <input id="current-password" type="password" autocomplete="current-password" required>
      </label>
      <label>
        New password
        <input id="new-password" type="password" autocomplete="new-password" required>
      </label>
      <label>
        New password again
        <input id="new-password-again" type="password" autocomplete="new-password" required>
      </label>
      <div id="password-status" class="status"></div>
      <button>Change password</button>
    </form>
  </dialog>

  <!-- The picture editor: move and zoom a new profile picture before it's uploaded. -->
  <dialog id="cropper">
    <h2>Edit picture</h2>
    <p class="crop-hint">Drag to move. Zoom with the slider (or the scroll wheel).</p>
    <canvas id="crop-canvas" width="256" height="256"></canvas>
    <label class="crop-zoom">
      Zoom
      <input type="range" id="crop-zoom" min="1" max="4" step="0.01" value="1">
    </label>
    <div class="crop-buttons">
      <button type="button" id="crop-cancel">Cancel</button>
      <button type="button" id="crop-save">Save</button>
    </div>
  </dialog>

  <!-- Someone's profile: opened by clicking a name or picture. -->
  <dialog id="profile">
    <button type="button" id="profile-close" title="Close">×</button>
    <div id="profile-avatar"></div>
    <h2 id="profile-name"></h2>
    <p id="profile-status"></p>
    <p id="profile-bio"></p>
    <button type="button" id="profile-message">Send message</button>
  </dialog>

  <!-- Phones only: darkens the chat behind an open drawer. -->
  <div id="drawer-backdrop" hidden></div>

  <!-- The popup for looking at a picture. Hidden until showModal() opens it. -->
  <dialog id="image-viewer">
    <button type="button" id="viewer-close" title="Close">×</button>
    <img id="viewer-image" alt="">
  </dialog>

  <script>
    // Grab the HTML elements we need, by their id.
    const channelList = document.getElementById("channel-list");
    const dmList = document.getElementById("dm-list");
    const logoutButton = document.getElementById("logout");
    const settingsButton = document.getElementById("settings-button");
    const settingsDialog = document.getElementById("settings");
    const profileForm = document.getElementById("profile-form");
    const settingsAvatar = document.getElementById("settings-avatar");
    const changeAvatarButton = document.getElementById("change-avatar");
    const removeAvatarButton = document.getElementById("remove-avatar");
    const avatarInput = document.getElementById("avatar-input");
    const statusInput = document.getElementById("status-input");
    const bioInput = document.getElementById("bio-input");
    const profileStatusLine = document.getElementById("profile-status-line");
    const cropperDialog = document.getElementById("cropper");
    const cropCanvas = document.getElementById("crop-canvas");
    const cropZoom = document.getElementById("crop-zoom");
    const cropCancel = document.getElementById("crop-cancel");
    const cropSave = document.getElementById("crop-save");
    const profileDialog = document.getElementById("profile");
    const profileClose = document.getElementById("profile-close");
    const profileAvatar = document.getElementById("profile-avatar");
    const profileName = document.getElementById("profile-name");
    const profileStatus = document.getElementById("profile-status");
    const profileBio = document.getElementById("profile-bio");
    const profileMessage = document.getElementById("profile-message");
    const usernameForm = document.getElementById("username-form");
    const currentUsername = document.getElementById("current-username");
    const newUsernameInput = document.getElementById("new-username");
    const usernamePasswordInput = document.getElementById("username-password");
    const usernameStatus = document.getElementById("username-status");
    const settingsClose = document.getElementById("settings-close");
    const emailForm = document.getElementById("email-form");
    const currentEmail = document.getElementById("current-email");
    const newEmailInput = document.getElementById("new-email");
    const emailPasswordInput = document.getElementById("email-password");
    const emailStatus = document.getElementById("email-status");
    const passwordForm = document.getElementById("password-form");
    const currentPasswordInput = document.getElementById("current-password");
    const newPasswordInput = document.getElementById("new-password");
    const newPasswordAgainInput = document.getElementById("new-password-again");
    const passwordStatus = document.getElementById("password-status");
    const messages = document.getElementById("messages");
    const typingLine = document.getElementById("typing");
    const form = document.getElementById("chat-form");
    const input = document.getElementById("message-input");
    const onlineHeading = document.getElementById("online-heading");
    const onlineList = document.getElementById("online-list");
    const banner = document.getElementById("banner");
    const chat = document.getElementById("chat");
    const sidebarElement = document.getElementById("sidebar");
    const membersElement = document.getElementById("members");
    const topbarTitle = document.getElementById("topbar-title");
    const openSidebarButton = document.getElementById("open-sidebar");
    const openMembersButton = document.getElementById("open-members");
    const drawerBackdrop = document.getElementById("drawer-backdrop");
    const attachButton = document.getElementById("attach-button");
    const fileInput = document.getElementById("file-input");
    const uploadStatus = document.getElementById("upload-status");
    const dropOverlay = document.getElementById("drop-overlay");
    const trayElement = document.getElementById("tray");
    const viewer = document.getElementById("image-viewer");
    const viewerImage = document.getElementById("viewer-image");
    const viewerClose = document.getElementById("viewer-close");

    let socket = null;         // our WebSocket (replaced with a new one if it drops)
    let currentChannel = null;  // the channel (or DM) we're looking at
    let firstChannel = null;    // where to start: the first channel in the list
    let myId = null;            // our own user id; the server tells us in its "welcome"
    let reconnectDelay = 1000;  // milliseconds to wait before the next reconnect attempt
    const unread = new Set();   // channels and DMs with messages we haven't seen

    // Ask the server which channels exist, make a sidebar button for each, then connect.
    async function start() {
      const response = await fetch("/channels");
      const channels = await response.json();  // e.g. ["general", "memes"]

      for (const channel of channels) {
        const button = document.createElement("button");
        button.className = "channel";
        button.textContent = "# " + channel;
        button.dataset.channel = channel;  // remember which channel this button is for
        button.addEventListener("click", () => switchChannel(channel, "#" + channel));
        channelList.appendChild(button);
      }

      firstChannel = channels[0];
      connect();
    }

    // Open the WebSocket. Called once at the start, and again each time the connection drops.
    function connect() {
      // On the real site the page comes over HTTPS, so the WebSocket must be encrypted too:
      // wss:// instead of ws:// (like https:// instead of http://).
      const protocol = location.protocol === "https:" ? "wss:" : "ws:";
      socket = new WebSocket(`${protocol}//${location.host}/ws`);

      // We can only send once the connection is open, so join a channel then.
      socket.addEventListener("open", () => {
        reconnectDelay = 1000;  // it worked, so start from 1 second again next time
        banner.hidden = true;
        if (currentChannel === null) {
          switchChannel(firstChannel, "#" + firstChannel);  // first time: open the first channel
        } else {
          joinCurrentChannel();  // reconnected: rejoin where we were, which reloads the history
        }
      });

      socket.addEventListener("message", handleServerMessage);

      socket.addEventListener("close", (event) => {
        if (event.code === 4001) {
          location.href = "/login";  // the server says we're not logged in
          return;
        }
        // Try again later, waiting twice as long each time (max 10 seconds): exponential backoff.
        banner.hidden = false;
        setTimeout(connect, reconnectDelay);
        reconnectDelay = Math.min(reconnectDelay * 2, 10000);
      });
    }

    // Send something to the server, but only if we're connected. Returns true if it was sent.
    // (A closed WebSocket silently throws away what you send, and a connecting one throws an error.)
    function sendToServer(data) {
      if (socket.readyState !== WebSocket.OPEN) return false;
      socket.send(JSON.stringify(data));  // object -> JSON string
      return true;
    }

    // Everything the server sends comes through here. Its "type" says what it is.
    function handleServerMessage(event) {
      const data = JSON.parse(event.data);  // JSON string -> object

      if (data.type === "welcome") {
        myId = data.id;
        return;
      }
      if (data.type === "renamed") {
        // Someone changed their username. The DM list already updated (from the "users"
        // message); reload the messages on screen so old messages show the new name too.
        if (data.id !== myId && currentChannel === dmChannel(data.id)) {
          setLabel("@" + data.username);  // we're in a DM with them
        }
        if (currentChannel !== null) joinCurrentChannel();
        return;
      }
      if (data.type === "users") {
        showUsers(data.users);
        return;
      }
      if (data.type === "unread") {
        for (const channel of data.channels) {
          if (channel !== currentChannel) unread.add(channel);  // where we are is never unread
        }
        updateSidebar();
        return;
      }

      // Everything else belongs to a channel. Ignore it if it's for a channel we
      // just left (it was already on its way when we switched).
      if (data.channel !== currentChannel) return;

      if (data.type === "history") {
        for (const message of data.messages) {
          showMessage(message);
        }
      } else if (data.type === "message") {
        stopTyping(data.name);  // their message arrived, so they're done typing
        showMessage(data);
      } else if (data.type === "typing") {
        showTyping(data.name);
      }
    }

    // Show where we are: in the text box's placeholder, and in the phone top bar.
    function setLabel(label) {
      input.placeholder = "Message " + label;
      topbarTitle.textContent = label;
    }

    // Switch channel or DM. `label` is what to show in the text box, like "#general" or "@kari".
    function switchChannel(channel, label) {
      closeDrawers();  // on a phone: picking a channel closes the drawer
      if (channel === currentChannel) return;
      currentChannel = channel;
      setLabel(label);
      unread.delete(channel);  // opening it means we've seen it
      updateSidebar();
      joinCurrentChannel();
    }

    // Clear the screen and tell the server where we are. It answers with the history.
    // (If we're disconnected right now, nothing is sent; we rejoin when we reconnect.)
    function joinCurrentChannel() {
      messages.replaceChildren();  // remove all the old messages
      clearTyping();
      sendToServer({ type: "join", channel: currentChannel });
    }

    // The DM channel name for us and another person: both user ids, smallest first,
    // so both people end up with the same name. Users 7 and 3, either way round -> "dm:3:7".
    // Ids, not usernames: a username can change, an id never does.
    function dmChannel(otherId) {
      // sort() on its own compares as *text*, so [10, 9] would stay [10, 9] ("1" comes before "9").
      // (a, b) => a - b makes it compare as numbers: negative means a goes first.
      const ids = [myId, otherId].sort((a, b) => a - b);
      return "dm:" + ids.join(":");
    }

    // Mark the sidebar buttons (channels and DMs): highlight where we are, and dot the unread ones.
    function updateSidebar() {
      // querySelectorAll finds every element matching a CSS selector:
      // here, everything with a data-channel attribute (all channel and DM buttons).
      for (const button of document.querySelectorAll("[data-channel]")) {
        button.classList.toggle("active", button.dataset.channel === currentChannel);
        button.classList.toggle("unread", unread.has(button.dataset.channel));
      }
      // Phones: a dot on ☰ if anything is unread, since the sidebar is hidden there.
      openSidebarButton.classList.toggle("has-unread", unread.size > 0);
    }

    // ---------- Phone drawers ----------
    // On phones the sidebar and the online list are drawers. Opening one just adds the
    // "open" class; the CSS slides it into view.

    function openDrawer(drawer) {
      drawer.classList.add("open");
      drawerBackdrop.hidden = false;
    }

    function closeDrawers() {
      sidebarElement.classList.remove("open");
      membersElement.classList.remove("open");
      drawerBackdrop.hidden = true;
    }

    openSidebarButton.addEventListener("click", () => openDrawer(sidebarElement));
    openMembersButton.addEventListener("click", () => openDrawer(membersElement));
    drawerBackdrop.addEventListener("click", closeDrawers);

    // The user pressed Enter or clicked Send.
    form.addEventListener("submit", (event) => {
      event.preventDefault();  // stop the browser from reloading the page
      if (sending) return;     // still busy sending the tray
      const text = input.value.trim();

      // Files waiting in the tray? Send those, with the text as the caption.
      if (tray.length > 0) {
        sendTray(text);
        return;
      }

      if (text === "") return;
      // Only the text: the server knows who we are and which channel we're in.
      // If we're disconnected, keep the text in the box so it can be sent later.
      if (!sendToServer({ type: "message", text: text })) return;
      input.value = "";
      lastTypingSent = 0;  // so typing the next message is announced straight away
    });

    // Log out: the server forgets our session, then we go back to the login page.
    logoutButton.addEventListener("click", async () => {
      await fetch("/logout", { method: "POST" });
      location.href = "/login";
    });

    // ---------- Settings ----------

    settingsButton.addEventListener("click", async () => {
      closeDrawers();  // on a phone, the sidebar drawer was open
      usernameForm.reset();  // empty the fields from last time
      usernameStatus.textContent = "";
      emailForm.reset();
      passwordForm.reset();
      emailStatus.textContent = "";
      passwordStatus.textContent = "";
      profileStatusLine.textContent = "";
      settingsDialog.showModal();

      // Ask the server for our current details, to show them.
      const response = await fetch("/me");
      if (response.ok) {
        const me = await response.json();  // {username, email, avatar, status, bio}
        currentUsername.textContent = me.username;
        currentEmail.textContent = me.email || "none yet";
        statusInput.value = me.status || "";
        bioInput.value = me.bio || "";
        settingsAvatar.replaceChildren(makeAvatar(myId, me.username, "large"));
      }
    });
    settingsClose.addEventListener("click", () => settingsDialog.close());

    // ---------- Settings: profile ----------

    profileForm.addEventListener("submit", async (event) => {
      event.preventDefault();
      const result = await postJson("/settings/profile", { status: statusInput.value, bio: bioInput.value });
      if (result.ok) {
        showStatus(profileStatusLine, "Profile saved.", "success");
      } else {
        showStatus(profileStatusLine, result.error, "error");
      }
    });

    changeAvatarButton.addEventListener("click", () => avatarInput.click());

    // Picking a picture opens the editor (move and zoom); nothing is uploaded until Save.
    avatarInput.addEventListener("change", async () => {
      const file = avatarInput.files[0];
      avatarInput.value = "";  // so the same file can be picked again later
      if (!file) return;
      try {
        openCropper(await loadPicture(file));
      } catch {
        showStatus(profileStatusLine, "Couldn't read that picture. Try a PNG or JPEG.", "error");
      }
    });

    async function uploadAvatar(picture) {
      showStatus(profileStatusLine, "Uploading…", "success");
      const response = await fetch("/settings/avatar", {
        method: "POST",
        headers: { "Content-Type": picture.type },
        body: picture,
      });
      if (!response.ok) {
        const error = await response.json().catch(() => ({}));
        showStatus(profileStatusLine, typeof error.detail === "string" ? error.detail : "Upload failed.", "error");
        return;
      }
      // The server sends everyone (us too) an updated "users" list, which redraws the pictures.
      // The one in Settings isn't part of that, so we redraw it when the list arrives (see showUsers).
      showStatus(profileStatusLine, "Picture changed.", "success");
    }

    removeAvatarButton.addEventListener("click", async () => {
      const response = await fetch("/settings/avatar", { method: "DELETE" });
      if (response.ok) showStatus(profileStatusLine, "Picture removed.", "success");
    });

    // Load a picture file so it can be drawn. Fails if the browser can't read it.
    async function loadPicture(file) {
      const url = URL.createObjectURL(file);  // a temporary local address for the file
      const img = new Image();
      img.src = url;
      try {
        await img.decode();  // wait until the browser has loaded the picture
      } finally {
        URL.revokeObjectURL(url);  // once loaded, the picture stays usable without it
      }
      return img;
    }

    // Cut a square out of the original picture (left, top, side: in the picture's own pixels)
    // and shrink it to 256x256 on a <canvas>, then save that as a small image file.
    // A phone photo of several MB becomes a few KB.
    function squareToFile(img, left, top, side) {
      const size = 256;
      const canvas = document.createElement("canvas");
      canvas.width = size;
      canvas.height = size;
      // drawImage(picture, cut out x, y, width, height, ..., draw at x, y, width, height)
      canvas.getContext("2d").drawImage(img, left, top, side, side, 0, 0, size, size);

      // toBlob turns the canvas into an image file. It reports back through a callback
      // instead of returning, so we wrap it in a Promise to be able to "await" it.
      // (Browsers that can't make WebP give us a PNG instead; the server accepts both.)
      return new Promise((resolve, reject) => {
        canvas.toBlob((blob) => (blob ? resolve(blob) : reject()), "image/webp", 0.85);
      });
    }

    // ---------- Picture editor (move and zoom before uploading) ----------
    //
    // The preview canvas is VIEW x VIEW pixels and shown as a circle. Three numbers describe
    // where the picture is: `cropScale` (how much it's enlarged: canvas pixels per picture pixel)
    // and `cropX`, `cropY` (where its top-left corner is, in canvas pixels; 0 or negative).

    const VIEW = 256;
    const MAX_ZOOM = 4;
    let cropImage = null;
    let cropMinScale = 1;  // the zoom where the picture's shorter side just fills the circle
    let cropScale = 1;
    let cropX = 0;
    let cropY = 0;

    function openCropper(img) {
      cropImage = img;
      // Start like the automatic crop: the shorter side fills the circle, centred.
      cropMinScale = VIEW / Math.min(img.naturalWidth, img.naturalHeight);
      cropScale = cropMinScale;
      cropX = (VIEW - img.naturalWidth * cropScale) / 2;
      cropY = (VIEW - img.naturalHeight * cropScale) / 2;
      cropZoom.value = 1;
      drawCrop();
      cropperDialog.showModal();
    }

    // Keep the picture covering the whole circle: its left edge may not move right of the
    // canvas's left edge (x <= 0), and its right edge may not move left of the canvas's right
    // edge (x >= VIEW - width). The same for top and bottom.
    function clampCrop() {
      const width = cropImage.naturalWidth * cropScale;
      const height = cropImage.naturalHeight * cropScale;
      cropX = Math.min(0, Math.max(VIEW - width, cropX));
      cropY = Math.min(0, Math.max(VIEW - height, cropY));
    }

    function drawCrop() {
      clampCrop();
      const context = cropCanvas.getContext("2d");
      context.clearRect(0, 0, VIEW, VIEW);
      context.drawImage(
        cropImage, cropX, cropY, cropImage.naturalWidth * cropScale, cropImage.naturalHeight * cropScale
      );
    }

    // Zoom to `factor` times the minimum (1 to MAX_ZOOM), keeping the middle of the view in place:
    // find which point of the picture is in the middle now, then put that same point
    // back in the middle at the new zoom.
    function setZoom(factor) {
      factor = Math.min(MAX_ZOOM, Math.max(1, factor));
      const middleX = (VIEW / 2 - cropX) / cropScale;  // in the picture's own pixels
      const middleY = (VIEW / 2 - cropY) / cropScale;
      cropScale = cropMinScale * factor;
      cropX = VIEW / 2 - middleX * cropScale;
      cropY = VIEW / 2 - middleY * cropScale;
      cropZoom.value = factor;
      drawCrop();
    }

    cropZoom.addEventListener("input", () => setZoom(Number(cropZoom.value)));

    // The scroll wheel zooms too. { passive: false } is needed to be allowed to call
    // preventDefault() (which stops the wheel from also scrolling the page).
    cropCanvas.addEventListener("wheel", (event) => {
      event.preventDefault();
      const current = cropScale / cropMinScale;
      setZoom(event.deltaY < 0 ? current * 1.1 : current / 1.1);  // deltaY < 0: wheel turned up
    }, { passive: false });

    // Dragging, with pointer events: one set of events for mouse, finger and pen alike.
    let dragFrom = null;  // where the pointer was last time, while dragging

    cropCanvas.addEventListener("pointerdown", (event) => {
      // Keep receiving this pointer's moves even if it slides off the canvas mid-drag.
      cropCanvas.setPointerCapture(event.pointerId);
      dragFrom = { x: event.clientX, y: event.clientY };
    });

    cropCanvas.addEventListener("pointermove", (event) => {
      if (!dragFrom) return;
      // The pointer moves in screen pixels, but the canvas may be shown smaller than its
      // VIEW pixels (on a phone), so convert: canvas pixels per screen pixel.
      const ratio = VIEW / cropCanvas.getBoundingClientRect().width;
      cropX += (event.clientX - dragFrom.x) * ratio;
      cropY += (event.clientY - dragFrom.y) * ratio;
      dragFrom = { x: event.clientX, y: event.clientY };
      drawCrop();
    });

    function stopDragging() {
      dragFrom = null;
    }
    cropCanvas.addEventListener("pointerup", stopDragging);
    cropCanvas.addEventListener("pointercancel", stopDragging);  // e.g. the phone took over the touch

    cropCancel.addEventListener("click", () => cropperDialog.close());

    cropSave.addEventListener("click", async () => {
      // Which square of the original picture is inside the circle? Turn canvas pixels back
      // into picture pixels: the circle's corner (0, 0) is at -cropX / cropScale in the picture,
      // and the circle's VIEW pixels cover VIEW / cropScale picture pixels.
      const left = -cropX / cropScale;
      const top = -cropY / cropScale;
      const side = VIEW / cropScale;
      cropperDialog.close();
      let picture;
      try {
        picture = await squareToFile(cropImage, left, top, side);
      } catch {
        showStatus(profileStatusLine, "Couldn't save that picture.", "error");
        return;
      }
      await uploadAvatar(picture);
    });

    function showStatus(element, text, kind) {
      element.className = "status " + kind;  // "error" (red) or "success" (green)
      element.textContent = text;
    }

    // Send JSON to the server. Returns {ok: true, data} or {ok: false, error: "message to show"}.
    async function postJson(url, data) {
      const response = await fetch(url, {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify(data),
      });
      const result = await response.json().catch(() => ({}));
      if (response.ok) return { ok: true, data: result };
      return { ok: false, error: typeof result.detail === "string" ? result.detail : "Something went wrong." };
    }

    usernameForm.addEventListener("submit", async (event) => {
      event.preventDefault();
      const result = await postJson("/settings/username", {
        username: newUsernameInput.value,
        password: usernamePasswordInput.value,
      });
      if (!result.ok) {
        showStatus(usernameStatus, result.error, "error");
        return;
      }
      currentUsername.textContent = result.data.username;
      usernameForm.reset();
      showStatus(usernameStatus, "Username changed.", "success");
    });

    emailForm.addEventListener("submit", async (event) => {
      event.preventDefault();
      const result = await postJson("/settings/email", {
        email: newEmailInput.value,
        password: emailPasswordInput.value,
      });
      if (!result.ok) {
        showStatus(emailStatus, result.error, "error");
        return;
      }
      currentEmail.textContent = result.data.email;
      emailForm.reset();
      showStatus(emailStatus, "Email saved.", "success");
    });

    passwordForm.addEventListener("submit", async (event) => {
      event.preventDefault();
      if (newPasswordInput.value !== newPasswordAgainInput.value) {
        showStatus(passwordStatus, "The two new passwords don't match.", "error");
        return;
      }
      const result = await postJson("/settings/password", {
        current_password: currentPasswordInput.value,
        new_password: newPasswordInput.value,
      });
      if (!result.ok) {
        showStatus(passwordStatus, result.error, "error");
        return;
      }
      passwordForm.reset();
      showStatus(passwordStatus, "Password changed. Your other devices have been logged out.", "success");
    });

    // ---------- People: DM list and online list ----------

    function makeDot(online) {
      const dot = document.createElement("span");
      dot.className = online ? "dot online" : "dot";
      return dot;
    }

    // Everyone we know about, by id: {3 => {id, name, online, avatar, status, bio}, ...}.
    // Filled from the server's "users" list. Messages only carry the sender's id, and look
    // up the picture here, so a changed picture shows up everywhere at once.
    const people = new Map();

    // Colours for the letter circles. Each person always gets the same one (their id picks it).
    const LETTER_COLOURS = ["#5865f2", "#3ba55c", "#faa61a", "#ed4245", "#eb459e", "#9b59b6", "#1abc9c"];

    // A profile picture: the real one if the person has one, otherwise a coloured circle with
    // their first letter. `size` is "small", "" (normal) or "large".
    // userId can be null: messages from before accounts existed (we only have the typed name).
    function makeAvatar(userId, name, size) {
      const person = people.get(userId);
      let avatar;
      if (person && person.avatar) {
        avatar = document.createElement("img");
        avatar.src = "/avatars/" + encodeURIComponent(person.avatar);
        avatar.alt = "";  // decorative: the name is always shown next to it
      } else {
        avatar = document.createElement("div");
        avatar.classList.add("letter");
        avatar.textContent = (name || "?").charAt(0).toUpperCase();
        avatar.style.background = userId ? LETTER_COLOURS[userId % LETTER_COLOURS.length] : "#4e5058";
      }
      avatar.classList.add("avatar");
      if (size) avatar.classList.add(size);
      // Remember whose picture this is, so it can be redrawn when they change it.
      avatar.dataset.avatarFor = userId ?? "";  // ?? means "or, if it's null/undefined"
      avatar.dataset.avatarName = name || "";
      avatar.dataset.avatarSize = size || "";
      return avatar;
    }

    // After a "users" update: replace every picture on the page with a fresh one, so changed
    // pictures appear on old messages too, without reloading anything.
    function redrawAvatars() {
      for (const old of document.querySelectorAll("[data-avatar-for]")) {
        if (old.dataset.avatarFor === "") continue;  // pre-account messages never change
        const userId = Number(old.dataset.avatarFor);
        const fresh = makeAvatar(userId, old.dataset.avatarName, old.dataset.avatarSize);
        if (old.classList.contains("clickable")) fresh.classList.add("clickable");
        old.replaceWith(fresh);
      }
    }

    // A row for one person: picture with an online dot, name, and status underneath.
    function makePerson(user) {
      const row = document.createElement("span");
      row.className = "person";

      const picture = document.createElement("span");
      picture.className = "person-picture";
      picture.appendChild(makeAvatar(user.id, user.name, "small"));
      picture.appendChild(makeDot(user.online));
      row.appendChild(picture);

      const text = document.createElement("span");
      text.className = "person-text";
      const name = document.createElement("span");
      name.textContent = user.name;
      text.appendChild(name);
      if (user.status) {
        const status = document.createElement("span");
        status.className = "person-status";
        status.textContent = user.status;
        text.appendChild(status);
      }
      row.appendChild(text);
      return row;
    }

    // `users` is every account: [{id: 3, name: "axel", online: true, avatar, status, bio}, ...]
    function showUsers(users) {
      people.clear();
      for (const user of users) people.set(user.id, user);

      // DM list in the sidebar: everyone except us.
      dmList.replaceChildren();
      for (const user of users) {
        if (user.id === myId) continue;
        const button = document.createElement("button");
        button.className = "channel";
        button.dataset.channel = dmChannel(user.id);
        button.appendChild(makePerson(user));
        button.addEventListener("click", () => switchChannel(dmChannel(user.id), "@" + user.name));
        dmList.appendChild(button);
      }
      updateSidebar();  // the buttons are new, so mark the active and unread ones again

      // Online list on the right: only the people who are online. Click one for their profile.
      const online = users.filter((user) => user.online);
      onlineHeading.textContent = `Online — ${online.length}`;
      onlineList.replaceChildren();
      for (const user of online) {
        const item = document.createElement("li");
        item.classList.add("clickable");
        item.appendChild(makePerson(user));
        item.addEventListener("click", () => openProfile(user.id));
        onlineList.appendChild(item);
      }

      redrawAvatars();  // messages, the profile popup and Settings
    }

    // ---------- Profile popup ----------

    let profileUserId = null;  // whose profile is open

    function openProfile(userId) {
      const person = people.get(userId);
      if (!person) return;  // pre-account messages have no profile
      profileUserId = userId;
      closeDrawers();
      profileAvatar.replaceChildren(makeAvatar(userId, person.name, "large"));
      profileName.textContent = person.name;
      profileStatus.textContent = person.status || "";
      profileBio.textContent = person.bio || "";
      profileMessage.hidden = userId === myId;  // no DMs with yourself
      profileDialog.showModal();
    }

    profileMessage.addEventListener("click", () => {
      const person = people.get(profileUserId);
      profileDialog.close();
      switchChannel(dmChannel(profileUserId), "@" + person.name);
    });
    profileClose.addEventListener("click", () => profileDialog.close());

    // ---------- "is typing…" ----------

    // Sending: the "input" event fires on every keystroke, but we tell the server
    // at most once every 2 seconds (throttling), so we don't flood it.
    let lastTypingSent = 0;  // when we last sent "typing", in milliseconds
    input.addEventListener("input", () => {
      const now = Date.now();  // milliseconds since 1970: a simple clock
      if (input.value.trim() !== "" && now - lastTypingSent > 2000) {
        if (sendToServer({ type: "typing" })) {
          lastTypingSent = now;
        }
      }
    });

    // Showing: who's typing, each with a timer that removes them after 3 quiet seconds.
    const typers = new Map();  // name -> timer id

    function showTyping(name) {
      clearTimeout(typers.get(name));  // cancel their old timer, if any...
      const timer = setTimeout(() => stopTyping(name), 3000);  // ...and start a fresh one
      typers.set(name, timer);
      updateTypingLine();
    }

    function stopTyping(name) {
      clearTimeout(typers.get(name));
      typers.delete(name);
      updateTypingLine();
    }

    function clearTyping() {
      for (const timer of typers.values()) {
        clearTimeout(timer);
      }
      typers.clear();
      updateTypingLine();
    }

    function updateTypingLine() {
      const names = [...typers.keys()];  // the Map's keys as a normal array
      if (names.length === 0) {
        typingLine.textContent = "";
      } else if (names.length === 1) {
        typingLine.textContent = `${names[0]} is typing…`;
      } else if (names.length === 2) {
        typingLine.textContent = `${names[0]} and ${names[1]} are typing…`;
      } else {
        typingLine.textContent = "Several people are typing…";
      }
    }

    // ---------- Uploads: the tray, the + button, drag-and-drop and pasting ----------

    const MAX_UPLOAD_SIZE = 10 * 1024 * 1024;  // 10 MB, same as the server
    const MAX_TRAY_FILES = 10;
    const IMAGE_TYPES = ["image/png", "image/jpeg", "image/gif", "image/webp"];  // same as the server

    // Files waiting to be sent: [{file, previewUrl, failed}]. Nothing is uploaded until Enter.
    const tray = [];
    let sending = false;  // true while the tray is being uploaded and sent

    // All three ways of adding files (+ button, drop, paste) end up here.
    function addToTray(files) {
      for (const file of files) {
        if (file.size > MAX_UPLOAD_SIZE) {
          showUploadError(`${file.name} is too big (max 10 MB)`);
          continue;
        }
        if (file.size === 0) {
          showUploadError(`${file.name} is empty`);
          continue;
        }
        if (tray.length >= MAX_TRAY_FILES) {
          showUploadError(`At most ${MAX_TRAY_FILES} files at a time`);
          break;
        }
        // For pictures, a temporary local address so we can show a preview
        // straight from your computer, without uploading anything yet.
        const previewUrl = IMAGE_TYPES.includes(file.type) ? URL.createObjectURL(file) : null;
        tray.push({ file: file, previewUrl: previewUrl, failed: false });
      }
      renderTray();
      input.focus();  // put the cursor in the text box, ready for a caption or Enter
    }

    // Take a file out of the tray, and free its preview's memory.
    function takeFromTray(item) {
      if (item.previewUrl) URL.revokeObjectURL(item.previewUrl);
      tray.splice(tray.indexOf(item), 1);  // splice(position, 1) removes one element there
      renderTray();
    }

    // Redraw the tray from the `tray` list.
    function renderTray() {
      trayElement.replaceChildren();
      trayElement.hidden = tray.length === 0;

      for (const item of tray) {
        const div = document.createElement("div");
        div.className = "tray-item";
        div.title = item.file.name;  // shows the full name when you hover over it
        if (item.failed) div.classList.add("failed");

        if (item.previewUrl) {
          const img = document.createElement("img");
          img.src = item.previewUrl;
          img.alt = item.file.name;
          div.appendChild(img);
        } else {
          div.classList.add("file");
          div.textContent = `📄 ${item.file.name} (${formatSize(item.file.size)})`;
        }

        const remove = document.createElement("button");
        remove.type = "button";
        remove.className = "remove";
        remove.title = "Remove";
        remove.textContent = "×";
        remove.addEventListener("click", () => {
          if (!sending) takeFromTray(item);
        });
        div.appendChild(remove);

        trayElement.appendChild(div);
      }
    }

    // Enter was pressed with files in the tray: upload and send each one as its own message.
    // The caption goes with the first file that's sent. Files that fail stay in the tray.
    async function sendTray(caption) {
      if (socket.readyState !== WebSocket.OPEN) {
        showUploadError("Not connected, try again in a moment");
        return;
      }
      sending = true;

      for (const item of [...tray]) {  // a copy, since we take items out as we go
        const fileId = await uploadFile(item.file);
        const sent = fileId !== null && sendToServer({ type: "message", text: caption, file: fileId });
        if (!sent) {
          item.failed = true;  // keep it in the tray, outlined in red
          continue;
        }
        takeFromTray(item);
        if (caption) {
          caption = "";      // the caption went with this file, so it's used up
          input.value = "";
        }
      }

      sending = false;
      lastTypingSent = 0;
      renderTray();  // show any failed ones in red
    }

    // Upload one file. Returns its id from the server, or null if it failed (and shows why).
    async function uploadFile(file) {
      uploadStatus.className = "";
      uploadStatus.textContent = `Uploading ${file.name}…`;
      let response;
      try {
        // Send the raw file over normal HTTP. The name goes in the URL;
        // encodeURIComponent makes characters like spaces and & safe to put in a URL.
        response = await fetch("/upload?filename=" + encodeURIComponent(file.name), {
          method: "POST",
          headers: { "Content-Type": file.type || "application/octet-stream" },
          body: file,
        });
      } catch {
        showUploadError(`Couldn't upload ${file.name}`);  // network trouble
        return null;
      }
      if (!response.ok) {
        // Show the server's reason if it gave one, e.g. "Files can be at most 10 MB."
        const error = await response.json().catch(() => ({}));
        showUploadError(typeof error.detail === "string" ? error.detail : `Couldn't upload ${file.name}`);
        return null;
      }
      uploadStatus.textContent = "";
      const data = await response.json();  // {"id": "..."}
      return data.id;
    }

    function showUploadError(text) {
      uploadStatus.className = "error";
      uploadStatus.textContent = text;
      setTimeout(() => {
        if (uploadStatus.textContent === text) uploadStatus.textContent = "";
      }, 5000);
    }

    // 1. The + button opens the browser's file picker (the hidden <input type="file">).
    attachButton.addEventListener("click", () => fileInput.click());
    fileInput.addEventListener("change", () => {
      addToTray([...fileInput.files]);  // copy the list first...
      fileInput.value = "";               // ...then reset, so the same file can be picked again
    });

    // 2. Drag-and-drop. Only react to dragged *files* (not, say, a bit of selected text).
    function isDraggingFiles(event) {
      return event.dataTransfer.types.includes("Files");
    }

    chat.addEventListener("dragover", (event) => {
      if (!isDraggingFiles(event)) return;
      event.preventDefault();  // required, or the browser won't let us accept the drop
      dropOverlay.hidden = false;
    });
    // Once shown, the overlay covers the whole chat, so leaving the overlay = leaving the chat.
    dropOverlay.addEventListener("dragleave", () => {
      dropOverlay.hidden = true;
    });
    dropOverlay.addEventListener("drop", (event) => {
      event.preventDefault();  // stop the browser from opening the file itself
      dropOverlay.hidden = true;
      addToTray([...event.dataTransfer.files]);
    });
    // Dropped somewhere else on the page (like the sidebar)? Then the browser would open the
    // file and leave the chat. Prevent that everywhere; only the chat area accepts drops.
    window.addEventListener("dragover", (event) => event.preventDefault());
    window.addEventListener("drop", (event) => event.preventDefault());

    // 3. Pasting: a copied screenshot or image arrives as a file on the clipboard.
    document.addEventListener("paste", (event) => {
      const files = [...event.clipboardData.files];
      if (files.length === 0) return;  // just text: let the normal paste happen
      event.preventDefault();
      addToTray(files);
    });

    // ---------- Image popup ----------

    function openImage(url, name) {
      viewerImage.src = url;
      viewerImage.alt = name;
      viewer.showModal();  // open as a modal: on top of everything; Esc closes it
    }

    // A click on the picture has the <img> as its target; a click on the dark area
    // around it has the dialog itself as the target. Only the second one closes it.
    viewer.addEventListener("click", (event) => {
      if (event.target === viewer) viewer.close();
    });
    viewerClose.addEventListener("click", () => viewer.close());
    // However it was closed (Esc, outside, ×), drop the picture so the next one
    // doesn't briefly show the old one while loading.
    viewer.addEventListener("close", () => viewerImage.removeAttribute("src"));

    // ---------- Messages ----------

    // Turn a size in bytes into something readable, like "2.3 MB".
    function formatSize(bytes) {
      if (bytes < 1024) return bytes + " B";
      if (bytes < 1024 * 1024) return (bytes / 1024).toFixed(1) + " KB";
      return (bytes / (1024 * 1024)).toFixed(1) + " MB";
    }

    // The element showing an attached file: the picture itself, or a download link.
    function makeAttachment(file) {
      const url = "/uploads/" + encodeURIComponent(file.id);
      const link = document.createElement("a");
      link.href = url;

      if (file.image) {
        // A normal click opens the popup instead of following the link. Middle-click or
        // right-click > "Open in new tab" still work, since they don't fire "click".
        link.target = "_blank";
        link.rel = "noopener";  // a new tab gets no access back to ours
        link.addEventListener("click", (event) => {
          event.preventDefault();
          openImage(url, file.filename);
        });
        const img = document.createElement("img");
        img.className = "attachment-image";
        img.src = url;
        img.alt = file.filename;
        link.appendChild(img);
      } else {
        link.className = "attachment-file";
        link.textContent = `📄 ${file.filename} (${formatSize(file.size)})`;
      }
      return link;
    }

    // Add one message to the bottom of the #messages box.
    // Built piece by piece with textContent, never innerHTML: names and text are
    // shown as-is, so neither can ever run as code.
    function showMessage(message) {
      const div = document.createElement("div");
      div.className = "message";

      // The sender's picture on the left. Pictures and names open their profile when clicked
      // (except for messages from before accounts existed, which have no profile).
      const avatar = makeAvatar(message.user_id, message.name, "");
      div.appendChild(avatar);

      const body = document.createElement("div");
      body.className = "message-body";

      const nameElement = document.createElement("div");
      nameElement.className = "name";
      nameElement.textContent = message.name;
      body.appendChild(nameElement);

      if (message.user_id) {
        avatar.classList.add("clickable");
        nameElement.classList.add("clickable");
        // The click handler goes on the message, not on the picture: pictures get swapped
        // for fresh ones when someone changes theirs, and a handler on the old one would be lost.
        div.addEventListener("click", (event) => {
          if (event.target.closest(".avatar, .name")) openProfile(message.user_id);
        });
      }

      if (message.text) {
        const text = document.createElement("div");
        text.textContent = message.text;
        body.appendChild(text);
      }
      if (message.file) {
        body.appendChild(makeAttachment(message.file));
      }
      div.appendChild(body);

      // Were we scrolled to (or near) the bottom before this message arrived?
      const distanceFromBottom = messages.scrollHeight - messages.scrollTop - messages.clientHeight;
      const wasAtBottom = distanceFromBottom < 50;

      // A picture only gets its real height once it has loaded, which pushes the
      // messages up after we've scrolled. So scroll again when it finishes loading.
      // (Only the attached picture: profile pictures always have the same fixed size.)
      const img = div.querySelector(".attachment-image");
      if (img && wasAtBottom) {
        img.addEventListener("load", () => {
          messages.scrollTop = messages.scrollHeight;
        });
      }

      messages.appendChild(div);

      // Only follow new messages if we were already at the bottom,
      // so we don't yank someone away from older messages they're reading.
      if (wasAtBottom) {
        messages.scrollTop = messages.scrollHeight;
      }
    }

    start();
  </script>
</body>
</html>
